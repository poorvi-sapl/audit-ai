[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auditai"
version = "0.1.0"
description = "AuditAI ETL pipeline: workpaper normalization, SOP RAG, and SFT pair generation"
requires-python = ">=3.10"
dependencies = [
    # Config & env
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",

    # Data extraction — Excel
    "pandas>=2.1",
    "openpyxl>=3.1",
    "xlrd>=2.0",

    # Data extraction — Word
    "python-docx>=1.1",

    # Data extraction — PDF (digital)
    "pdfplumber>=0.10",
    "pdfminer.six>=20221105",
    "pypdf>=4.0",

    # Password-protected files
    "pikepdf>=8.0",
    "msoffcrypto-tool>=5.0",

    # OCR path — image preprocessing
    "pdf2image>=1.16",
    "opencv-python-headless>=4.8",

    # OCR fallback (calls system Tesseract 5.3+ binary)
    "pytesseract>=0.3",

    # Data extraction — DBF / FoxPro
    "dbfread>=2.0",
    "simpledbf>=0.2",

    # File-type detection
    "python-magic>=0.4",

    # XML (recovery mode for malformed files)
    "lxml>=5.0",

    # Encoding detection
    "chardet>=5.0",

    # PII scrubbing (Presidio with custom US recognizers)
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",

    # Token counting — Mistral tokenizer (authoritative per architecture)
    "mistral-common>=1.3",

    # Storage drivers
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pymongo>=4.6",
    "qdrant-client>=1.9",
    "redis>=5.0",

    # Near-duplicate detection (MinHash for rollforward detection)
    "datasketch>=1.6",

    # LLM client — Ollama (local dev / extraction drafting with Gemma 3 12B)
    "ollama>=0.2",

    # Structured output / constrained decoding (R7 classifier)
    "outlines>=1.3.0",

    # ML experiment tracking
    "mlflow>=2.11",

    # Data version control (JSONL versioning)
    "dvc>=3.0",

    # Utilities
    "tqdm>=4.66",
    "rich>=13.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Heavy GPU dependencies — install only on machines with CUDA
ocr = [
    "docling>=2.0",
    "surya-ocr>=0.6",
]

# Airflow orchestration — only needed on the Airflow worker/scheduler node
airflow = [
    "apache-airflow>=2.9",
    "apache-airflow-providers-celery>=3.5",
    "apache-airflow-providers-mongo>=4.0",
    "celery[redis]>=5.3",
    "arq>=0.25",
]

# Model training — only on the GPU training node
training = [
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.10",
    "trl>=0.8",
    "bitsandbytes>=0.43",
    "sentence-transformers>=3.0",
]

dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "ipykernel>=6.29",
    "types-PyYAML",
    "types-redis",
    "types-tqdm",
]

[tool.hatch.build.targets.wheel]
packages = [
    "auditai_data_normalization",
    "engineering_benchmark",
    "raw_to_training_pair",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
