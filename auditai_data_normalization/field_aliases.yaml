# auditai_data_normalization/field_aliases.yaml
# ==============================================
# Maps every known surface-form label variant → one canonical field name.
#
# How it works
# ------------
# normalize.py loads this file once at startup. When an extractor returns
# a raw dict keyed by whatever label appeared in the document, the alias
# resolver walks this file and rewrites each key to its canonical name.
# Unrecognized keys are passed through as-is under metadata{}.
#
# How to extend it
# ----------------
# When a real document produces a key that isn't mapped here, add it.
# Keep variants lowercase and stripped — the resolver lowercases and
# strips all keys before lookup so casing never matters.
# One canonical name per group. The canonical name is always snake_case.
#
# Sources used to seed this file
# --------------------------------
# - AD-5001 / NPO-CX-1.1  Engagement Acceptance and Continuance Form (ECE STEP)
# - ECEStep_Final_Financial_Statements_2024  (Harshwal & Company LLP)
# - config/pii_patterns.yaml  (from project archive)
# - config/field_mappings/busy.yaml  (from project archive)
# - AuditAI_DataNormalization.pptx  (WorkpaperRecord field list)
#
# Sections
# --------
# 1.  Document / engagement identity
# 2.  Dates
# 3.  People and roles
# 4.  Organization and client
# 5.  Audit scope and type
# 6.  Financial statement line items
# 7.  Balance sheet — assets
# 8.  Balance sheet — liabilities and net assets
# 9.  Income statement / statement of activities
# 10. Cash flow
# 11. Excel / tabular structure labels
# 12. Extraction and provenance metadata


