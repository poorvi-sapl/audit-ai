# config/sop_field_classes.yaml
# ================================
# SOP-QM-001 (NPO-CX-1.1) field classification.
#
# Versioning
# ----------
# Bump version on every SOP onboarding or class change.
# Snapshots are written to config/sop_field_classes_snapshots/ by
# reload_sop_field_classes() when version changes. Each snapshot records
# the full field list so diffs are reproducible.
#
# Purpose
# -------
# Single source of truth for whether a given SOP question/section can
# produce a legitimate audit finding. All downstream components
# (findings_extractor, completion_drafter, deficiency_sampler, claim_mapper)
# load this file to determine deficiency and citation eligibility.

version: "1.1"
effective_date: "2026-05-18"
sop_document: "SOP-QM-001 NPO-CX-1.1"

#
# Key slug convention
# -------------------
# Q-number slugs are lowercase with no parentheses:
#   Q1(a)          → q1a
#   Q9(b)          → q9b
#   Part II Q2(j)  → part_ii_q2j
#
# Classes
# -------
#   deficiency_eligible  — field can be legitimately missing / incomplete /
#                          contradictory. Findings allowed. Deficiency
#                          sampling allowed.
#   fixed_administrative — always pre-filled or always NO by SOP design.
#                          Findings forbidden. Citations allowed (reference
#                          context only).
#   informational_only   — present for documentation completeness only.
#                          Findings forbidden. Citations allowed.
#
# Required keys per entry
# -----------------------
#   class               : deficiency_eligible | fixed_administrative | informational_only
#   deficiency_allowed  : true | false  — whether a finding may be generated
#   citation_allowed    : true | false  — whether SOP §ref may appear in completion
#   canonical_field     : canonical field name from field_tiers.yaml, or null
#   label               : human-readable question label for UI / logging
#
# Extension keys (leave null until implemented)
# ---------------------------------------------
#   severity_default    : override default severity for this field's findings
#   client_type_overrides: per-client-type class overrides (e.g. includes_gagas
#                          is fixed_administrative for For-Profit but
#                          deficiency_eligible for Government/Tribal)
#   retrieval_weight    : float — boost/suppress this section during SOP retrieval
#   sampling_weight     : float — override deficiency_sampler tier weight for this field
#
# Last reviewed: 2026-05-15
# Based on: SOP_NPO_CX_1_1_Final_v10 — audit team analysis
# TODO: verify q1f, q1g canonical_field mappings against SOP docx

